[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gorilla-ai-backend"
version = "0.1.0"
description = "Advanced AI Assistant System"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.29",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "pgvector>=0.3.0",
    "redis[hiredis]>=5.0.3",

    # Vector DB
    "qdrant-client[fastembed]>=1.9.0",

    # Embeddings
    "FlagEmbedding>=1.2.10",
    "sentence-transformers>=3.0.0",
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "onnxruntime>=1.18.0",

    # LLM
    "openai>=1.30.0",  # Ollama uses OpenAI-compatible API
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",

    # Data validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",

    # Utils
    "python-dotenv>=1.0.1",
    "structlog>=24.1.0",
    "tenacity>=8.3.0",
    "tiktoken>=0.7.0",
    "numpy>=1.26.0",
    "rich>=13.7.0",

    # Task queue
    "celery[redis]>=5.3.6",

    # Security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
